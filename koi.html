<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Une carpe koï ASCII qui suit la souris." />
  <link rel="icon" href="/assets/img/logo.png" type="image/png">
  <title>Koï | Melih Cetinkaya</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: #000;
      overflow: hidden;
      color-scheme: dark;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    }

    .ocean {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      font-family: inherit;
      touch-action: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    body.is-ready .ocean {
      opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      .ocean {
        transition: none;
        opacity: 1;
      }
    }

    .clock {
      position: fixed;
      top: clamp(1.25rem, 4vh, 2.5rem);
      left: 50%;
      z-index: 1;
      transform: translateX(-50%);
      color: #c5e4f7;
      font-size: clamp(1.6rem, 3.8vw, 2.4rem);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.14em;
      text-shadow: 0 0 24px rgba(74, 144, 200, 0.35);
      pointer-events: none;
      user-select: none;
      opacity: 0.28;
      transition: opacity 0.45s ease;
    }

    .clock.is-awake {
      opacity: 1;
    }

    .fs-toggle {
      position: fixed;
      top: clamp(1rem, 3vh, 1.75rem);
      right: clamp(1rem, 3vw, 1.75rem);
      z-index: 1;
      display: grid;
      place-items: center;
      width: 1.7rem;
      height: 1.7rem;
      padding: 0;
      border: 1px solid rgba(126, 184, 232, 0.35);
      background: rgba(0, 0, 0, 0.45);
      color: #c5e4f7;
      font: inherit;
      font-size: 0.78rem;
      line-height: 1;
      letter-spacing: 0;
      cursor: pointer;
      backdrop-filter: blur(6px);
      opacity: 0.28;
      transition: opacity 0.45s ease, color 0.2s ease;
    }

    .fs-toggle:hover,
    .fs-toggle:focus-visible,
    .fs-toggle.is-awake {
      opacity: 1;
      color: #e8f4fc;
      outline: none;
    }

    .audio-panel {
      position: fixed;
      right: clamp(1rem, 3vw, 1.75rem);
      bottom: clamp(1rem, 3vw, 1.75rem);
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      width: min(22rem, calc(100vw - 2rem));
      padding: 0.55rem 0.7rem;
      border: 1px solid rgba(126, 184, 232, 0.35);
      background: rgba(0, 0, 0, 0.45);
      color: #c5e4f7;
      backdrop-filter: blur(6px);
      opacity: 0.28;
      transition: opacity 0.45s ease;
    }

    .audio-panel:hover,
    .audio-panel:focus-within,
    .audio-panel.is-awake {
      opacity: 1;
    }

    .audio-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .audio-toggle,
    .audio-loop,
    .audio-reset,
    .audio-excerpt-toggle,
    .audio-add-toggle,
    .audio-remove,
    .audio-skip {
      display: grid;
      place-items: center;
      width: 1.45rem;
      height: 1.45rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1;
      letter-spacing: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .audio-skip {
      width: 1.2rem;
      font-size: 0.85rem;
      opacity: 0.75;
    }

    .audio-skip:disabled,
    .audio-toggle:disabled,
    .audio-remove:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .audio-loop {
      width: 1.7rem;
      opacity: 0.45;
      font-size: 0.78rem;
    }

    .audio-loop[data-loop-mode="one"],
    .audio-loop[data-loop-mode="all"] {
      opacity: 1;
    }


    .audio-reset,
    .audio-excerpt-toggle,
    .audio-add-toggle,
    .audio-remove {
      width: auto;
      padding: 0 0.2rem;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      opacity: 0.75;
    }

    .audio-excerpt-toggle {
      display: none;
    }

    .audio-excerpt-actions {
      justify-content: space-between;
      gap: 0.75rem;
    }

    .audio-toggle:hover:not(:disabled),
    .audio-toggle:focus-visible:not(:disabled),
    .audio-loop:hover,
    .audio-loop:focus-visible,
    .audio-reset:hover,
    .audio-reset:focus-visible,
    .audio-excerpt-toggle:hover,
    .audio-excerpt-toggle:focus-visible,
    .audio-add-toggle:hover,
    .audio-add-toggle:focus-visible,
    .audio-remove:hover:not(:disabled),
    .audio-remove:focus-visible:not(:disabled),
    .audio-skip:hover:not(:disabled),
    .audio-skip:focus-visible:not(:disabled),
    .audio-volume:focus-visible {
      color: #e8f4fc;
      outline: none;
    }

    .audio-track {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 9rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      user-select: none;
    }

    .audio-track-meta {
      flex: 0 0 auto;
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      opacity: 0.55;
      user-select: none;
    }

    .audio-volume {
      flex: 1 1 auto;
      width: 5.5rem;
      height: 0.3rem;
      appearance: none;
      background: rgba(126, 184, 232, 0.25);
      border-radius: 0;
      cursor: pointer;
    }

    .audio-volume::-webkit-slider-thumb {
      appearance: none;
      width: 0.7rem;
      height: 0.7rem;
      background: #c5e4f7;
      border: 0;
      cursor: pointer;
    }

    .audio-volume::-moz-range-thumb {
      width: 0.7rem;
      height: 0.7rem;
      background: #c5e4f7;
      border: 0;
      border-radius: 0;
      cursor: pointer;
    }

    .audio-excerpt {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .audio-times {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
    }

    .audio-timeline {
      position: relative;
      height: 1.35rem;
      touch-action: none;
      cursor: pointer;
      user-select: none;
    }

    .audio-timeline-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 0.28rem;
      transform: translateY(-50%);
      background: rgba(126, 184, 232, 0.2);
    }

    .audio-timeline-range {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(126, 184, 232, 0.45);
    }

    .audio-timeline-progress {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      background: rgba(232, 244, 252, 0.55);
      pointer-events: none;
    }

    .audio-handle {
      position: absolute;
      top: 50%;
      width: 0.7rem;
      height: 0.7rem;
      border: 0;
      background: #c5e4f7;
      transform: translate(-50%, -50%);
      cursor: ew-resize;
      padding: 0;
    }

    .audio-handle[data-handle="playhead"] {
      width: 0.16rem;
      height: 1rem;
      background: #e8f4fc;
      pointer-events: none;
    }

    .audio-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(100% + 0.45rem);
      padding: 0.35rem 0.45rem;
      border: 1px solid rgba(126, 184, 232, 0.3);
      background: rgba(0, 0, 0, 0.7);
      color: #c5e4f7;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      line-height: 1.35;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .audio-hint.is-visible {
      opacity: 0.9;
    }

    .audio-add {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem;
    }

    .audio-panel.is-add-open .audio-add {
      display: grid;
    }

    .audio-add-youtube {
      grid-column: 1 / -1;
    }

    .audio-add-actions {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .audio-add input {
      width: 100%;
      min-width: 0;
      padding: 0.28rem 0.4rem;
      border: 1px solid rgba(126, 184, 232, 0.3);
      background: rgba(0, 0, 0, 0.35);
      color: #c5e4f7;
      font: inherit;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
    }

    .audio-add input::placeholder {
      color: rgba(197, 228, 247, 0.4);
    }

    .audio-add input:focus-visible {
      outline: none;
      border-color: rgba(232, 244, 252, 0.55);
      color: #e8f4fc;
    }

    .audio-add-submit {
      flex: 0 0 auto;
      width: 1.45rem;
      height: 1.45rem;
      padding: 0;
      border: 1px solid rgba(126, 184, 232, 0.35);
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.95rem;
      line-height: 1;
      cursor: pointer;
    }

    .audio-add-submit:hover,
    .audio-add-submit:focus-visible {
      color: #e8f4fc;
      outline: none;
    }

    .audio-add-error {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      opacity: 0.85;
      color: #e8b4b4;
    }

    /* Off-screen but real size: YT IFrame API is unreliable on near-invisible players. */
    .yt-host {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 480px;
      height: 270px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .audio-excerpt-toggle {
        display: grid;
      }

      .audio-panel:not(.is-excerpt-open) .audio-excerpt {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .clock,
      .audio-panel,
      .audio-hint,
      .fs-toggle {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <h1 class="visually-hidden">Carpe koï</h1>
  <time class="clock" data-clock datetime="" aria-live="polite"></time>
  <button
    class="fs-toggle"
    type="button"
    data-fs-toggle
    aria-pressed="false"
    aria-label="Plein écran"
    title="Plein écran"
  >⛶</button>
  <div class="audio-panel" data-audio-panel>
    <p class="audio-hint" data-audio-hint aria-hidden="true">space play · , . piste · ∞ modes · [ ] A/B · ← → seek</p>
    <div class="audio-row">
      <button class="audio-toggle" type="button" data-audio-toggle aria-pressed="false" aria-label="Lecture">▶</button>
      <button class="audio-skip" type="button" data-audio-prev aria-label="Piste précédente" title="Piste précédente">‹</button>
      <span class="audio-track" data-audio-track-label aria-live="polite">—</span>
      <span class="audio-track-meta" data-audio-track-meta aria-hidden="true">0/0</span>
      <button class="audio-skip" type="button" data-audio-next aria-label="Piste suivante" title="Piste suivante">›</button>
      <button
        class="audio-loop"
        type="button"
        data-audio-loop
        data-loop-mode="one"
        aria-pressed="true"
        aria-label="Boucle piste"
        title="Boucle piste"
      >∞</button>
      <label class="visually-hidden" for="koi-volume">Volume</label>
      <input
        class="audio-volume"
        id="koi-volume"
        type="range"
        data-audio-volume
        min="0"
        max="1"
        step="0.01"
        value="0.55"
        aria-valuemin="0"
        aria-valuemax="1"
        aria-valuenow="0.55"
      />
      <button
        class="audio-excerpt-toggle"
        type="button"
        data-audio-excerpt-toggle
        aria-expanded="false"
        aria-controls="koi-excerpt"
      >extrait</button>
    </div>
    <div class="audio-excerpt" id="koi-excerpt" data-audio-excerpt>
      <div class="audio-times" aria-hidden="true">
        <span data-audio-time-current>0:00</span>
        <span>
          <span data-audio-time-a>A 0:00</span>
          ·
          <span data-audio-time-b>B 0:00</span>
        </span>
        <span data-audio-time-duration>0:00</span>
      </div>
      <div
        class="audio-timeline"
        data-audio-timeline
        role="slider"
        tabindex="0"
        aria-label="Position et extrait A B"
        aria-valuemin="0"
        aria-valuemax="0"
        aria-valuenow="0"
      >
        <div class="audio-timeline-track">
          <div class="audio-timeline-range" data-audio-range></div>
          <div class="audio-timeline-progress" data-audio-progress></div>
        </div>
        <button class="audio-handle" type="button" data-handle="a" aria-label="Début extrait A"></button>
        <button class="audio-handle" type="button" data-handle="b" aria-label="Fin extrait B"></button>
        <div class="audio-handle" data-handle="playhead" aria-hidden="true"></div>
      </div>
      <div class="audio-row audio-excerpt-actions">
        <button class="audio-reset" type="button" data-audio-reset aria-label="Réinitialiser l'extrait">reset extrait</button>
        <button
          class="audio-remove"
          type="button"
          data-audio-remove
          aria-label="Supprimer la piste"
          title="Supprimer la piste"
        >remove</button>
        <button
          class="audio-add-toggle"
          type="button"
          data-audio-add-toggle
          aria-expanded="false"
          aria-controls="koi-add"
        >add extrait</button>
      </div>
      <form class="audio-add" id="koi-add" data-audio-add autocomplete="off" hidden>
        <label class="visually-hidden" for="koi-add-id">id</label>
        <input id="koi-add-id" name="id" type="text" data-audio-add-id placeholder="id" maxlength="64" required />
        <label class="visually-hidden" for="koi-add-label">label</label>
        <input id="koi-add-label" name="label" type="text" data-audio-add-label placeholder="label" maxlength="80" required />
        <label class="visually-hidden" for="koi-add-youtube">youtube id</label>
        <input
          class="audio-add-youtube"
          id="koi-add-youtube"
          name="youtube"
          type="text"
          data-audio-add-youtube
          placeholder="youtube id"
          maxlength="128"
          required
        />
        <div class="audio-add-actions">
          <button class="audio-add-submit" type="submit" aria-label="Ajouter la piste" title="Ajouter">+</button>
          <p class="audio-add-error" data-audio-add-error aria-live="polite"></p>
        </div>
      </form>
    </div>
  </div>
  <audio data-koi-audio preload="metadata" crossorigin="anonymous"></audio>
  <div class="yt-host" data-koi-yt aria-hidden="true"></div>
  <canvas class="ocean" data-ocean aria-hidden="true"></canvas>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/assets/js/ocean.min.js"></script>
  <script src="/assets/js/koi-companion.js"></script>
</body>
</html>
